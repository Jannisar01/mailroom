name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: tests
        run: uv run pytest
      - name: types
        run: uv run pyright
      - name: issues
        run: |
          ok=0
          for f in issues/*.md; do echo "$f"; uv run mailroom check-issue "$f" || ok=1; done
          exit $ok
